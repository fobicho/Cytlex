<!doctype html>
<html lang="es" data-theme="default" data-mode="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('cytlex:settings:v1');
          var s = raw ? JSON.parse(raw) : {};
          var theme = (s && s.theme) || 'default';
          var mode = (s && s.mode) || 'light';
          if (theme === 'dark') theme = 'default';
          if (theme === 'light') { theme = 'default'; mode = 'light'; }
          var themes = ['default','beige','esmeralda','violeta','rosa','oceano'];
          if (themes.indexOf(theme) === -1) theme = 'default';
          if (mode !== 'dark' && mode !== 'light') mode = 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.setAttribute('data-mode', mode);
          var bg = {
            default: { dark: '#09090b', light: '#ffffff' },
            beige: { dark: '#241d14', light: '#f7f1e6' },
            esmeralda: { dark: '#131b18', light: '#f2f8f5' },
            violeta: { dark: '#16121c', light: '#f7f4fa' },
            rosa: { dark: '#1b1317', light: '#fbf4f7' },
            oceano: { dark: '#11191d', light: '#f0f7f9' }
          };
          var color = (bg[theme] || bg.default)[mode] || (mode === 'dark' ? '#09090b' : '#ffffff');
          document.documentElement.style.backgroundColor = color;
          if (document.body) document.body.style.backgroundColor = color;
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Cytlex</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
